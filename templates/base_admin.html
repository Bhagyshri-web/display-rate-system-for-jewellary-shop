<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin – Gayatri Jewellers</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<header class="bar"><strong>Gayatri Jewellers · Admin</strong>
{% if session.admin %}<form method="post" action="{{ url_for('admin.logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="plain">Log out</button></form>{% endif %}</header>
<main>
{% for cat, msg in get_flashed_messages(with_categories=true) %}<p class="flash {{ cat }}">{{ msg }}</p>{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
