<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8bd9e">
  <title>Gayatri Jewellers – Gold &amp; Silver Rates</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/display.css') }}">
</head>
<body>
  <main class="board" aria-label="Gayatri Jewellers gold and silver rate display">
    <div class="wood" aria-hidden="true"></div>
    <div class="arch" aria-hidden="true"></div>
    <div class="ray" aria-hidden="true"></div>
    <div class="floor" aria-hidden="true"></div>
    <div class="decor leaves" aria-hidden="true"></div>
    <div class="decor bangles" aria-hidden="true"></div>
    <div class="decor bars" aria-hidden="true"></div>
    <div class="decor silver-bowl" aria-hidden="true"></div>

    <header class="top">
      <img class="shop-logo" src="{{ url_for('static', filename='img/gj_logo.png') }}" alt="Gayatri Jewellers logo">
      <div class="brand">
        <h1>GAYATRI JEWELLERS</h1>
        <p>TRUST <span>◆</span> TRADITION <span>◆</span> TIMELESS BEAUTY</p>
      </div>
      <div class="when">
        <div class="date-pill">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v5m10-5v5M3 10h18M7 14h2m4 0h2m-8 4h2m4 0h2"/></svg>
          <time id="date">—</time>
        </div>
        <div id="clock" class="clock">--:--:--</div>
      </div>
    </header>

    <div class="heading">GOLD &amp; SILVER</div>
    <div class="subheading">Rates</div>

    <!-- Kept the original ID: display.js still creates and refreshes all cards here. -->
    <section class="cards" id="cards" aria-label="Current rates"></section>

    <footer class="bottom">
      <div class="footer-divider" aria-hidden="true">
        <svg viewBox="0 0 70 42"><path d="M35 4Q40 18 35 35Q30 18 35 4M35 35Q22 31 17 18Q29 22 35 35M35 35Q48 31 53 18Q41 22 35 35" fill="currentColor"/><path d="M4 25q19 4 26 12m36-12Q47 29 40 37" stroke="currentColor" fill="none" stroke-width="2"/></svg>
      </div>
      <div class="footer-text">STAY TUNED FOR DAILY UPDATES</div>
      <div class="footer-metadata">
        <div class="status" id="status"><i></i><span id="statusText">Connecting…</span></div>
        <div class="notice" id="notice"></div>
        <div class="ticker"><div class="track" id="ticker"></div></div>
      </div>
    </footer>
  </main>
  <!-- Original JavaScript, real API and SSE refresh logic are unchanged. -->
  <script src="{{ url_for('static', filename='js/display.js') }}"></script>
</body>
</html>
